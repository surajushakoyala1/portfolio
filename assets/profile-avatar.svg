<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyberAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base Canvas -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGlow)"/>

  <!-- Tech Geometric Background Grid & Neural Nodes -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.2">
    <!-- Neural Lines -->
    <line x1="60" y1="120" x2="140" y2="90" stroke-dasharray="3,3"/>
    <line x1="140" y1="90" x2="200" y2="60"/>
    <line x1="200" y1="60" x2="280" y2="85" stroke-dasharray="3,3"/>
    <line x1="280" y1="85" x2="340" y2="130"/>
    <line x1="330" y1="260" x2="290" y2="310"/>
    <line x1="80" y1="270" x2="120" y2="320" stroke-dasharray="3,3"/>
    <!-- Nodes -->
    <circle cx="60" cy="120" r="3" fill="#38bdf8"/>
    <circle cx="140" cy="90" r="4" fill="#818cf8"/>
    <circle cx="200" cy="60" r="4.5" fill="#38bdf8"/>
    <circle cx="280" cy="85" r="3.5" fill="#a855f7"/>
    <circle cx="340" cy="130" r="4" fill="#38bdf8"/>
    <circle cx="330" cy="260" r="3.5" fill="#818cf8"/>
    <circle cx="290" cy="310" r="3" fill="#38bdf8"/>
    <circle cx="80" cy="270" r="3.5" fill="#a855f7"/>
    <circle cx="120" cy="320" r="4" fill="#38bdf8"/>
  </g>

  <!-- Subtle Concentric Orbit Circles -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,8"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Tech Binary / Code Elements floating -->
  <g font-family="monospace" font-size="11" fill="#38bdf8" fill-opacity="0.45">
    <text x="60" y="180">&lt;AI/ML&gt;</text>
    <text x="295" y="195">{py}</text>
    <text x="75" y="235">0110</text>
    <text x="285" y="240">data.fit()</text>
  </g>

  <!-- Stylized Programmer / Techie Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M 100 375 C 100 300, 140 265, 200 265 C 260 265, 300 300, 300 375 Z" fill="url(#bodyGrad)"/>
  <path d="M 120 375 C 120 310, 150 280, 200 280 C 250 280, 280 310, 280 375 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Collar / Hoodie V-Neck -->
  <polygon points="175,275 200,315 225,275" fill="#0f172a"/>
  <path d="M 190 295 L 200 310 L 210 295" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="184" y="225" width="32" height="50" rx="10" fill="#e2e8f0"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="46" ry="54" fill="url(#skinGrad)"/>

  <!-- Modern Hair Style -->
  <path d="M 150 170 C 150 120, 175 110, 205 110 C 240 110, 255 130, 255 165 C 250 150, 235 140, 205 140 C 175 140, 160 155, 150 170 Z" fill="#0f172a"/>

  <!-- Minimalist Tech Smart Glasses with Neon Glow -->
  <g filter="url(#neonBlur)">
    <!-- Bridge -->
    <line x1="192" y1="178" x2="208" y2="178" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Frame -->
    <rect x="165" y="168" width="28" height="18" rx="5" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="168" y1="174" x2="182" y2="174" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Right Frame -->
    <rect x="207" y="168" width="28" height="18" rx="5" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="210" y1="174" x2="224" y2="174" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Smile / Expression -->
  <path d="M 190 208 Q 200 215 210 208" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Glowing Headset / Earphones -->
  <rect x="146" y="165" width="8" height="26" rx="4" fill="#6366f1"/>
  <rect x="246" y="165" width="8" height="26" rx="4" fill="#6366f1"/>

  <!-- Glowing Outer Neon Border -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="url(#neonRing)" stroke-width="4" filter="url(#neonBlur)"/>
  
  <!-- Subtle Status Dot on avatar border -->
  <circle cx="330" cy="285" r="14" fill="#090d16"/>
  <circle cx="330" cy="285" r="10" fill="#10b981"/>
  <circle cx="330" cy="285" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
